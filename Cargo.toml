[package]
name = "breath"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "A native GNOME breathing exercise application"
homepage = "https://github.com/moriwaka/breath"
repository = "https://github.com/moriwaka/breath"

[lib]
name = "breath"
path = "src/lib.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
gst = { version = "0.25.3", package = "gstreamer" }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_20"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: fedora:latest

    steps:
      - name: Install build and validation tools
        run: |
          dnf install --assumeyes \
            appstream \
            cargo \
            desktop-file-utils \
            git \
            gcc \
            libadwaita-devel \
            gstreamer1-devel \
            gtk4-devel \
            make \
            nodejs \
            pkgconf-pkg-config \
            rpm-build \
            rpmlint \
            clippy \
            rustfmt

      - name: Check out source
        uses: actions/checkout@v5

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run offline Rust tests
        run: cargo test --offline

      - name: Run Clippy
        run: cargo clippy --all-targets --offline -- -D warnings

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.moriwaka.Breath.desktop
          appstreamcli validate --no-net data/io.github.moriwaka.Breath.metainfo.xml

      - name: Check non-display UI smoke test
        shell: bash
        run: |
          python3 -m py_compile tests/ui_smoke.py
          python3 -m py_compile tests/ui_locale.py tests/ui_audio_failure.py
          PYTHONPATH=tests python3 -m unittest \
            tests/test_ui_helpers.py tests/test_screenshot_regression.py
          set +e
          python3 tests/ui_smoke.py
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 77

      - name: Check translated and audio failure UI tests
        shell: bash
        run: |
          set +e
          python3 tests/ui_locale.py
          locale_status=$?
          python3 tests/ui_audio_failure.py
          audio_status=$?
          set -e
          test "$locale_status" -eq 0 -o "$locale_status" -eq 77
          test "$audio_status" -eq 0 -o "$audio_status" -eq 77

      - name: Check screenshot regression test harness
        run: python3 -m py_compile tests/screenshot_regression.py

      - name: Build and lint Fedora RPM
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          mkdir -p work/rpmbuild/SOURCES work/rpmbuild/TMP
          tar --exclude=.git --exclude=target --exclude=work --sort=name \
            --transform="s,^\./,breath-${version}/," \
            -czf "work/rpmbuild/SOURCES/breath-${version}.tar.gz" .
          rpmbuild -ba breath.spec \
            --define "_topdir $GITHUB_WORKSPACE/work/rpmbuild" \
            --define "_sourcedir $GITHUB_WORKSPACE/work/rpmbuild/SOURCES" \
            --define "_tmppath $GITHUB_WORKSPACE/work/rpmbuild/TMP"
          rpmlint work/rpmbuild/RPMS/x86_64/*.rpm
